name: Games-only source index integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-game-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check curated Games references without network access
        run: |
          python scripts/export_game_links.py --check
          python -m unittest discover -s tests -v
